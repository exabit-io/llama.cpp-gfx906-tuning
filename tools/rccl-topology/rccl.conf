# RCCL configuration for every process on this machine (read by librccl; NCCL_* environment variables override it).
# The topology is regenerated on every boot by rccl-topology.service from sysfs (the XGMI ring of the GPUs).
# To use a hand-made topology instead, point this line at your own file.
NCCL_TOPO_FILE=/var/cache/rccl/topology.xml
