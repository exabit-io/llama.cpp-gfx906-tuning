# /etc/rccl.conf -- RCCL configuration for every process on this machine (read by librccl; NCCL_* environment
# variables override it). Installed by gfx906-rccl-topology; local edits are kept on upgrade.
#
# The topology file below is rewritten on every boot by gfx906-rccl-topology.service from sysfs (the XGMI ring of the
# gfx906 GPUs). To use a hand-made topology instead, point this line at your own file. If the file is missing, RCCL
# reports it and detects the topology itself.
NCCL_TOPO_FILE=/var/cache/gfx906-rccl-topology/topology.xml
